name: Test

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/test.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/test.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: TappNetwork/workflows/.github/workflows/test.yml@main
    with:
      php_version: '8.3'
      phpunit_config: 'phpunit.xml.dist'
      timeout_minutes: 10
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
